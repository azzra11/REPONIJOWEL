<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIST Library Login</title>
  <link rel="stylesheet" href="login1.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif; 
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <img src="backg.png" alt="SPIST Building" class="background-img">
      <div class="overlay">
        <img src="logo.png" alt="SPIST Logo" class="logo">
        <h1>Southern Philippines Institute<br>of Science & Technology <br> Library</h1>
      </div>
    </div>
    <div class="right-panel">
      <div class="right-panel-content">
        <div class="header-wrapper">
          <hr class="small-line">
          <h2>SPIST LIBRARY</h2>
        </div>
        
    <button>Log in as a Student</button>
    <button>Log in as a Admin</button>
    <button>Sign in</button>
    <div class="social-icons">
      <img src="gmail.jpg" alt="Gmail"/>
      <img src="facebook.png" alt="Facebook"/>
      <img src="insta.png" alt="Instagram"/>
    </div>
  </div>
</body>
</html>
