<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIST Library Login</title>
  <link rel="stylesheet" href="login4.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif; 
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <img src="backg.png" alt="SPIST Building" class="background-img"> <!-- Give a class -->
      <div class="overlay">
        <img src="logo.png" alt="SPIST Logo" class="logo"> <!-- Keep logo separate -->
        <h1>Southern Philippines Institute<br>of Science & Technology Library</h1>
      </div>
    </div>
    <div class="right-panel">
      <div class="right-panel-content">
        <div class="header-wrapper">
          <hr class="small-line">
          <h2>SPIST LIBRARY</h2>
        </div>
        <form>
            <input type="name" placeholder="Name" required>
            <input type="student" placeholder="Student ID" required>
            <input type="course" placeholder="Course & Year" required>
          <input type="email" placeholder="Email" required>
          <input type="password" placeholder="Password" required>
          <div class="options">
            <label><input type="checkbox"> Show Password</label>
            <a href="#">Forgot Password</a>
          </div>
          <button type="submit">Create An Account</button>
          <div class="optionss">
          <a href="#">Already Have An Account?</a>
          </div>
        </form>
        <div class="socials">
          <img src="gmail.jpg" alt="Gmail">
          <img src="facebook.png" alt="Facebook">
          <img src="insta.png" alt="Instagram">
        </div>
      </div>
    </div>
</body>
</html>
