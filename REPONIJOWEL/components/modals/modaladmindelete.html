<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delete Admin Modal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #388e3c;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      background-color: #388e3c;
      color: white;
      padding: 30px 40px;
      border: 5px solid white;
      border-radius: 30px;
      text-align: center;
      width: 350px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .modal p {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: space-around;
    }

    .buttons button {
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      background-color: white;
      color: #388e3c;
      transition: background-color 0.3s;
    }

    .buttons button:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>

  <div class="modal">
    <p>Are sure you want to delete this Admin?</p>
    <div class="buttons">
      <button onclick="alert('Admin Deleted')">Yes</button>
      <button onclick="alert('Cancelled')">No</button>
    </div>
  </div>

</body>
</html>
