<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delete Admin Modal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      background-color: #44a347;
      color: #E6F0DC;
      padding: 30px 40px;
      border: 5px solid white;
      border-radius: 30px;
      text-align: center;
      width: 350px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .modal p {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .buttons {
      padding: 10px;
      display: flex;
      justify-content: space-around;
    }

    .buttons button {
      width: 90px;
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      background-color: white;
      color: #388e3c;
      transition: background-color 0.3s;
    }

    .buttons button:hover {
      background-color: wheat;
    }

  .table-wrapper {
    width: 350px;
    height: 80px;
    overflow-x: auto;
    background: #fff;
    padding: 10px 0 0 0;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
  }
  
  .user-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 5px;
  }
  .user-table th,
  .user-table td {
    padding: 10px 10px;
    text-align: center;
    border-bottom: 1px solid #685f5f;

  }
  </style>
</head>
<body>

  <div class="modal">
    <p>Are sure you want to delete this Admin?</p>

    <div class="table-wrapper">
      <table class="user-table">
        <thead>
          <tr>
           
          </tr>
        </thead onclick="">
        <tbody>
          <tr> 
            
          </tr>
        </tbody>
      </table>
     </div>

    <div class="buttons">
      <button onclick="alert('Admin Deleted')">Yes</button>
      <button onclick="alert('Cancelled')">No</button>
    </div>
  </div>

</body>
</html>
