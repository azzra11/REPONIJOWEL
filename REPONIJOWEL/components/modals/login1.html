<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Southern Philippines Institute of Science & Technology</title>
  <link rel="icon" type="image/png" href="/REPONIJOWEL/ASSETS/imgFolder/school-logo-large.png" />
  <link rel="stylesheet" href="/REPONIJOWEL/ASSETS/cssFolder/login1.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <img src="/REPONIJOWEL/ASSETS/imgFolder/schoolppp.png" alt="SPIST Building" class="background-img">
      <div class="overlay">
        <img src="/REPONIJOWEL//ASSETS/imgFolder/school-logo-large.png" alt="SPIST Logo" class="logo">
        <h1>Southern Philippines Institute<br>of Science & Technology <br> Library</h1>
      </div>
    </div>
    <div class="right-panel">
      <div class="right-panel-content">
        <div class="header-wrapper">
          <hr class="small-line">
          <h2>SPIST LIBRARY</h2>
        </div>
        <button onclick="redirectTo('login')" class="login">
          <i class="fas fa-sign-in-alt"></i> Log in as a Student
        </button>
        <button onclick="redirectTo('admin')" class="login">
          <i class="fas fa-sign-in-alt"></i> Log in as a Admin
        </button>
        <button onclick="redirectTo('signup')" class="signup">
          </i> Sign Up
        </button>
    <div class="social-icons">
      <a href="#" target="blank"><img src="/REPONIJOWEL/ASSETS/imgFolder/gmaili.png" alt="Gmail"/></a>
      <a href="https://www.facebook.com/spistofficial" target="blank"><img src="/REPONIJOWEL/ASSETS/imgFolder/facebookicon.png" alt="Facebook"/></a>
      <a href="https://www.instagram.com/spistofficial/?hl=en" target="blank"><img src="/REPONIJOWEL/ASSETS/imgFolder/igicon.png" alt="Instagram"/></a>
    </div>
  </div>

  <script>
    function redirectTo(action) {
      const buttons = document.querySelectorAll('.right-panel button');
      buttons.forEach(button => {
        button.classList.add('fade-out');
      });

      setTimeout(() => {
        if (action === 'login') {
          window.location.href = "/REPONIJOWEL/components/modals/login2.html";
        } else if (action === 'admin') {
          window.location.href = "/REPONIJOWEL/components/modals/login3.html";
        } else if (action === 'signup') {
          window.location.href = "/REPONIJOWEL/components/modals/login4.html";
        }
      }, 500); // Match this duration with the CSS transition duration
    }
  </script>
</body>
</html>
