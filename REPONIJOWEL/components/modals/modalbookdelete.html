<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Book to Delete</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      background-color: #44a347;
      color: #E6F0DC;
      padding: 30px 40px;
      border: 5px solid white;
      border-radius: 30px;
      text-align: center;
      width: 400px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .modal p {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .book-list {
      background-color: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 25px;
      text-align: left;
    }

    .book-item {
      display: flex;
      align-items: center;
      padding: 8px 0;
    }

    .book-item input[type="checkbox"] {
      margin-right: 10px;
      transform: scale(1.2);
    }

    .book-item label {
      font-weight: bold;
      color: #E6F0DC;
    }

    .buttons {
      display: flex;
      justify-content: space-around;
      padding: 10px;
    }

    .buttons button {
      width: 100px;
      padding: 10px 30px;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      background-color: white;
      color: #44a347;
      transition: background-color 0.3s;
    }

    .buttons button:hover {
      background-color: wheat;
    }
    .table-wrapper {
    width: 400px;
    height: 100px;
    overflow-x: auto;
    background: #fff;
    padding: 10px 0 0 0;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
  }
  
  .user-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 5px;
  }
  
  .user-table thead {
    padding: 10px;
  }
  
  .user-table th,
  .user-table td {
    padding: 10px 10px;
    text-align: center;
    border-bottom: 1px solid #685f5f;
  }
  </style>
</head>
<body>

  <div class="modal">
    <p>Are sure you want to delete the following book ?</p>
    
    <div class="table-wrapper">
      <table class="user-table">
        <thead>
          <tr>
          </tr>
        </thead onclick="">
        <tbody>
          <tr> 
          </tr>
        </tbody>
      </table>
     </div>
      
    <div class="buttons">
      <button onclick="confirmDelete()">Yes</button>
      <button onclick="alert('Cancelled')">No</button>
    </div>
  </div>

  <script>
    function confirmDelete() {
      const checked = Array.from(document.querySelectorAll('input[name="books"]:checked'))
                           .map(cb => cb.value);
      if (checked.length > 0) {
        alert('Deleting:\n' + checked.join('\n'));
      } else {
        alert('Please select at least one book to delete.');
      }
    }
  </script>

</body>
</html>
