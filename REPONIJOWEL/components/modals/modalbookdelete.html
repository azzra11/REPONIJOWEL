<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Book to Delete</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #388e3c;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      background-color: #388e3c;
      color: white;
      padding: 30px 40px;
      border: 5px solid white;
      border-radius: 30px;
      text-align: center;
      width: 400px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .modal p {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .book-list {
      background-color: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 25px;
      text-align: left;
    }

    .book-item {
      display: flex;
      align-items: center;
      padding: 8px 0;
    }

    .book-item input[type="checkbox"] {
      margin-right: 10px;
      transform: scale(1.2);
    }

    .book-item label {
      font-weight: bold;
      color: #388e3c;
    }

    .buttons {
      display: flex;
      justify-content: space-around;
    }

    .buttons button {
      padding: 10px 30px;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      background-color: white;
      color: #388e3c;
      transition: background-color 0.3s;
    }

    .buttons button:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>

  <div class="modal">
    <p>Are sure you want to delete the following book ?</p>
    <form class="book-list" id="bookForm">
      <div class="book-item">
        <input type="checkbox" id="book1" name="books" value="The Adventures of Huckleberry Finn">
        <label for="book1">The Adventures of Huckleberry Finn</label>
      </div>
      <div class="book-item">
        <input type="checkbox" id="book2" name="books" value="The Adventures of Tom Sawyer">
        <label for="book2">The Adventures of Tom Sawyer</label>
      </div>
      <div class="book-item">
        <input type="checkbox" id="book3" name="books" value="Treasure Island">
        <label for="book3">Treasure Island</label>
      </div>
    </form>

    <div class="buttons">
      <button onclick="confirmDelete()">Yes</button>
      <button onclick="alert('Cancelled')">No</button>
    </div>
  </div>

  <script>
    function confirmDelete() {
      const checked = Array.from(document.querySelectorAll('input[name="books"]:checked'))
                           .map(cb => cb.value);
      if (checked.length > 0) {
        alert('Deleting:\n' + checked.join('\n'));
      } else {
        alert('Please select at least one book to delete.');
      }
    }
  </script>

</body>
</html>
