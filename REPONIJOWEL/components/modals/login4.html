<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Southern Philippines Institute of Science & Technology</title>
  <link rel="icon" type="image/png" href="/REPONIJOWEL/ASSETS/imgFolder/school-logo-large.png" />
  <link rel="stylesheet" href="/REPONIJOWEL/ASSETS/cssFolder/login4.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <img src="/REPONIJOWEL/ASSETS/imgFolder/schoolppp.png" alt="SPIST Building" class="background-img">
      <div class="overlay">
        <img src="/REPONIJOWEL/ASSETS/imgFolder/school-logo-large.png" alt="SPIST Logo" class="logo">
        <h1>Southern Philippines Institute<br>of Science & Technology <br>Library</h1>
      </div>
    </div>
    <div class="right-panel">
      <div class="right-panel-content">
        <div class="header-wrapper">
          <hr class="small-line">
          <h2>SPIST LIBRARY</h2>
        </div>
        <form onsubmit="handleSubmit(event)">
          <input type="name" placeholder="Name" required style="color: #489255;">
          <input type="student" placeholder="Student ID" required style="color: #489255;">
          <input type="course" placeholder="Course & Year" required style="color: #489255;">
          <input type="email" placeholder="Email" required style="color: #489255;">
          <input type="password" id="password" placeholder="Password" required style="color: #489255;">
          <div class="options">
            <label><input type="checkbox" id="showPassword"> Show Password</label>
          </div>
          <button type="submit">Create An Account</button>
          <div class="optionss">
            <a href="#" class="signup" onclick="redirectToLogin(event)">
              Already Have An Account?
            </a>
          </div>
        </form>
        <div class="socials">
          <a href="#" target="blank"><img src="/REPONIJOWEL/ASSETS/imgFolder/gmaili.png" alt="Gmail"/></a>
          <a href="https://www.facebook.com/spistofficial" target="blank"><img src="/REPONIJOWEL/ASSETS/imgFolder/facebookicon.png" alt="Facebook"/></a>
          <a href="https://www.instagram.com/spistofficial/?hl=en" target="blank"><img src="/REPONIJOWEL/ASSETS/imgFolder/igicon.png" alt="Instagram"/></a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function handleSubmit(event) {
      event.preventDefault();
      const form = event.target;
      form.classList.add('fade-out');

      setTimeout(() => {
        window.location.href = "/REPONIJOWEL/components/modals/login3.html"; // Redirect to the desired page
      }, 500); // Match this duration with the CSS transition duration
    }

    function redirectToLogin(event) {
      event.preventDefault();
      const signupLink = event.target;
      signupLink.classList.add('fade-out');

      setTimeout(() => {
        window.location.href = "/REPONIJOWEL/components/modals/login1.html"; // Redirect to the desired page
      }, 500); // Match this duration with the CSS transition duration
    }

    // Function to toggle password visibility
    document.getElementById('showPassword').addEventListener('change', function() {
      const passwordField = document.getElementById('password');
      if (this.checked) {
        passwordField.type = 'text';
      } else {
        passwordField.type = 'password';
      }
    });
  </script>
</body>
</html>
