<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Southern Philippines Institute of Science & Technology</title>

  <!-- icon -->
  <link rel="icon" type="image/png" href="/REPONIJOWEL/ASSETS/imgFolder/school-logo-large.png" />

  <!--  CSS -->
  <link rel="stylesheet" href="/REPONIJOWEL/ASSETS/cssFolder/userprof.css" />

  <!-- Google Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      font-weight: bold;
      background-color: #e9f0e6;
      margin: 0;
      opacity: 0;
      animation: fadeInPage 1s ease-in-out forwards;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    .modal {
      background: white;
      border: 6px solid #3f9142;
      border-radius: 40px;
      padding: 30px;
      text-align: center;
      max-width: 400px;
      animation: scaleUp 0.3s ease-in-out;
    }

    .modal p {
      font-size: 20px;
      color: #3f9142;
      margin-bottom: 20px;
    }

    .modal-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .modal button {
      background-color: #3f9142;
      color: white;
      border: none;
      padding: 10px 30px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.3s;
    }

    .modal button:hover {
      background-color: #357d38;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes scaleUp {
      from {
        transform: scale(0.9);
      }
      to {
        transform: scale(1);
      }
    }

    @keyframes fadeInPage {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

<!-- Header -->
  <header>
    <div class="header-container">
      <img src="/REPONIJOWEL/ASSETS/imgFolder/school-logo-large.png" alt="School Logo" style="height: 40px; margin-right: 10px;" />
      <p>Southern Philippines Institute of Science & Technology</p>
    </div>
  </header>

  <!-- admin profile-->
  <aside class="sidebar">
    <div class="admincontiner">
     <div class="admin-profile">
       <p><span class="material-symbols-outlined">person</span><span style="font-weight: 150px;">John Doe</span></p>
       <div class="white"></div>
     </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar-container">
      <nav class="nav">
        <ul>
          <li>
            <a href="/REPONIJOWEL/components/modals/userprof.html"><span class="material-symbols-outlined">person</span> User</a>
          </li>
          <li>
            <a href="/REPONIJOWEL/components/pages/admin.html"><span class="material-symbols-outlined">admin_panel_settings</span> Admin</a>
          </li>
          <li>
            <a href="/REPONIJOWEL/components/pages/books.html"><span class="material-symbols-outlined">book</span> Books</a>
          </li>
          <li>
            <a href="#" onclick="showLogoutModal()"><span class="material-symbols-outlined">logout</span> Log out</a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <main class="container">
    <!-- maincontent start -->
      <div class="maincontent">
        <div class="contentarea">
          <h1>User:</h1>
    <!-- spacecontainer start -->
        <div class="spacecontainer">
          <div class="spacerdiv"></div>
        </div>
    <!-- spacecontainer end -->

    <!-- infosection start -->
        <div class="infosection">

    <!-- stdidcontainer start -->
      <div class="stdidcontainer">
        <div class="studidname" style="font-weight: bold;">Student id: </div>
        <div class="studid"><span style="font-weight: 50;"> c22-4587-01</span></div>
      </div>
    <!-- stdidcontainer end -->

    <!-- userinfo start -->
      <div class="userinfocontainer">

    <!-- userprofile start -->
      <div class="userprofile" style="gap: 15px; padding: 10px;">

    <!-- photocontainer Start -->
      <div class="photocontainer">
    <!-- photodiv Start -->
       <div class="photo"><span class="material-symbols-outlined">person_add</span></div>
    <!-- photodiv end-->
      </div>
    <!-- photocontainer end -->

    <!-- user name  start-->
      <div class="usernamecontainer">
        <div class="username" style="gap: 5px;">
          <h2 style="color: #44a347; margin: 0;">John Doe</h2>
          <hr style="background-color: #44a347; padding: 0.5px; width: 200px;">
        </div>
      </div>
    <!-- user name  end-->
      </div>
    <!-- userprofile end -->
      </div>
    <!--end of infosection-->

    <!-- userpersonalinfo start -->
    <div class="userpersonalinfo">

    <!-- start of ageyearcorse -->
    <div class="ayc">

    <!-- agecontainer start -->
    <div class="ageacontainer">
      <div class="age" style="font-weight: bold; color: #44a347;">Age: </div>
      <div class="agediv"></div>
    </div>
    <!-- agecontainer end -->
    </div>
    <!-- userpersonalinfo end -->

    <!-- start of Year&Course -->
    <div class="YearCourse-container">
      <div class="YearCourse" style="font-weight: bold; color: #44a347;">Year&Course: </div>
      <div class="YearCoursediv"></div>
    </div>
    <!-- end of Year&Course -->
    </div>
    <!-- end of ageyearcorse -->

    <!-- start  emuser-->
    <div class="emuser">

    <!-- start of email -->
    <div class="emailcontainer">
      <div class="email" style="font-weight: bold; color: #44a347;">Email: </div>
      <div class="emaildiv"></div>
    </div>
    <!-- end of email -->

    <!-- start of username -->
    <div class="usernamecontainer">
      <div class="username" style="font-weight: bold; color: #44a347;">Username: </div>
      <div class="usernamediv"></div>
    </div>
    <!-- end of username -->

    </div>
    <!-- start  emuser-->
    <div class="bookrentedcontainer">
      <div class="bookrented" style="font-weight: bold; color: #44a347;">Book rented: </div>
      <div class="bookrenteddiv"></div>
    </div>

    </div> <!--end of maincontent-->
  </main>

  <!-- Logout Modal Structure -->
  <div class="modal-overlay" id="logoutModal">
    <div class="modal">
      <p>Are you sure you want to log out?</p>
      <div class="modal-buttons">
        <button onclick="logout()">Yes</button>
        <button onclick="closeLogoutModal()">No</button>
      </div>
    </div>
  </div>

  <script>
    function showLogoutModal() {
      document.getElementById('logoutModal').style.display = 'flex';
    }

    function closeLogoutModal() {
      document.getElementById('logoutModal').style.display = 'none';
    }

    function logout() {
      closeLogoutModal();
      setTimeout(() => {
        window.location.href = '/REPONIJOWEL/components/modals/login1.html'; // Change this to the desired URL
      }, 1000); // Delay in milliseconds (1 second)
    }
  </script>

</body>
</html>
