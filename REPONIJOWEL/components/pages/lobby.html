<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Southern Philippines Institute of Science & Technology</title>

  <!-- icon -->
  <link rel="icon" type="image/png" href="/REPONIJOWEL/ASSETS/imgFolder/school-logo-large.png" />

  <!--  CSS -->
  <link rel="stylesheet" href="/REPONIJOWEL/ASSETS/cssFolder/lobby.css">

  <!-- Google Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

</head>
<body>
  <header>
    <img src="/REPONIJOWEL/ASSETS/imgFolder/school-logo-large.png" alt="Logo" class="logo">
    <h1 style="font-weight: bold;">Southern Philippines Institute of Science & Technology</h1>
  </header>

  <div class="container">
    <!-- Left Sidebar -->
    <div class="sidebar">

       <div class="admincontiner">
     <div class="admin-profile">
       <p><span class="material-symbols-outlined">person</span><span style="font-weight: 150px;">John Doe</span></p>
       <div class="white"></div>  
     </div>
    </div> 


    

      <div class="button">
        <div class="category-buttons">
            <h3>Categories</h3>
          <button class="cat-btn">Fantasy</button>
          <button class="cat-btn">Science Fiction</button>
          <button class="cat-btn">Mystery</button>
          <button class="cat-btn">Horror</button>
          <button class="cat-btn">Romance</button>
          <button class="cat-btn">Thriller</button>
        </div>
      </div>
    </div>

    <!-- Center Content -->
    <div class="main-content">
      <div class="title-search-bar">
        <h2 class="section-title">Book Titles:</h2>
        <div class="search-container">
          <input type="text" placeholder="Search..." />
          <button class="search-button">Search</button>
        </div>
      </div>
        <div class="book-list">
          <button class="book-button">The Adventures of Huckleberry Finn</button>
          <!-- Add more book items as needed -->
        </div>
      </div>

    <!-- Right Sidebar -->
    <div class="info-panels">
      <div class="panel books-due">
        <h3>Books Due</h3>
        <div class="content"></div>
      </div>
      <div class="panel books-borrowed">
        <h4>Books Borrowed</h4>
        <p>Books : <strong>0/2</strong></p>
        <hr />
      </div>
    </div>
  </div>
</body>
</html>
