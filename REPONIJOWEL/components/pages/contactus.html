<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/REPONIJOWEL/ASSETS/imgFolder/school-logo-large.png" />
  <link rel="stylesheet" href="/REPONIJOWEL/ASSETS/cssFolder/contactus.css" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Google Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- JavaScript -->
  <script src="/jsFolder/schooljs.js" defer></script>

  <title>Southern Philippines Institute of Science & Technology</title>
</head>

<body>
  <header class="primary-header flex">
    <div>
      <img src="/imgFolder/small.png" alt="SPiST Logo" class="logo" />
    </div>
    <nav>
      <ul class="primaryNavigation flex">
        <li>
          <a href="/REPONIJOWEL/components/pages/spistlibary.html ">
            <span class="material-symbols-outlined">home</span> Home
          </a>
        </li>
        <li>
          <a href="/REPONIJOWEL/components/pages/vision.html">
            <span class="material-symbols-outlined">star</span> Vision
          </a>
        </li>
        <li>
          <a href="/REPONIJOWEL/components/pages/aboutus.html">
            <span class="material-symbols-outlined">groups</span>About Us
          </a>
        </li>
        <li>
          <a href="/REPONIJOWEL/components/pages/contactus.html">
            <span class="material-symbols-outlined">call</span> Contact Us
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="mainsection">
      <div class="container">
        <div class="iconcontainer">
          <h1 class="ctus">CONTACT US</h1>
          <hr>

          <div class="contact-item">
            <img src="/REPONIJOWEL/ASSETS/imgFolder/call.png" alt="Phone Icon" class="contact-icon">
            <p>0953-293-382</p>
          </div>

          <div class="contact-item">
            <img src="/REPONIJOWEL/ASSETS/imgFolder/igicon.png" alt="Instagram Icon" class="contact-icon">
            <p>@Spistofficial</p>
          </div>

          <div class="contact-item">
            <img src="/REPONIJOWEL/ASSETS/imgFolder/gmaili.png" alt="Email Icon" class="contact-icon">
            <p>Spistedu@gmail.com</p>
          </div>

          <div class="contact-item">
            <img src="/REPONIJOWEL/ASSETS/imgFolder/facebookicon.png" alt="Facebook Icon" class="contact-icon">
            <p>Southern Philippines Institute of Science & Technology Official</p>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    // Add event listeners to the navigation links
document.querySelectorAll('.primaryNavigation a').forEach(link => {
  link.addEventListener('click', function(event) {
    event.preventDefault();
    const body = document.body;
    body.classList.add('fade-out');

    setTimeout(() => {
      window.location.href = this.getAttribute('href');
    }, 500); // Match this duration with the CSS transition duration
  });
});

  </script>
</body>
</html>

  
</body>
</html>
