<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile - SPIS&T</title>
  <link rel="stylesheet" href="/REPONIJOWEL/ASSETS/cssFolder/user.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <img src="/REPONIJOWEL/ASSETS/imgFolder/school-logo-large.png" alt="Logo" class="logo">
    Southern Philippines Institute of Science & Technology
  </header>


  <div class="container">
  <main class="main-area">
    <section class="user-card">
      <div class="card-header">
        <div class="left">
          <div class="user-icon">👤</div>
        </div>
        <div class="center">
          <div class="user-name">John Doe</div>
        </div>
        <div class="right">
          <div class="student-id">Student ID <span>c22-4587-01</span></div>
        </div>
      </div>
      <div class="user-details">
        <div class="left">
          <p><strong>Age :</strong> <span class="placeholder"></span></p>
          <p><strong>Email :</strong> <span class="placeholder"></span></p>
        </div>
        <div class="right">
          <p><strong>Year & Course :</strong> <span class="placeholder"></span></p>
          <p><strong>Username :</strong> <span class="placeholder"></span></p>
          <p><strong>Days of visit :</strong> <span class="placeholder"></span></p>
        </div>
      </div>
      <div class="book-rented">
        <strong>Book rented :</strong>
        <div class="book-box"></div>
      </div>
    </section>
  </main>

  <aside class="sidebar">
    <div class="admin-profile">
      <div class="admin-icon">👤</div>
      <div class="admin-name">Admin Doe</div>
    </div>
    <nav class="menu">
      <ul>
        <li class="active">👥 User</li>
        <li>👤 Admin</li>
        <li>📚 Books</li>
        <li>➕ Add books</li>
        <li>💬 Feedback</li>
        <li>🗂 Page Management</li>
      </ul>
    </nav>
    <div class="logout">↩ Log out</div>
  </aside>
  </div>
</body>
</html>
