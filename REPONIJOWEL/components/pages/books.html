<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Southern Philippines Institute of Science & Technology</title>

  <!-- icon -->
  <link rel="icon" type="image/png" href="/REPONIJOWEL/ASSETS/imgFolder/school-logo-large.png" />

  <!--  CSS -->
  <link rel="stylesheet" href="/REPONIJOWEL/ASSETS/cssFolder/books.css" />

  <!-- Google Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <!-- Roboto Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      font-weight: bold;
      background-color: #e9f0e6;
      margin: 0;
      opacity: 0;
      animation: fadeInPage 1s ease-in-out forwards;
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    /* Modal box */
    .modal {
      background: white;
      border: 6px solid #3f9142;
      border-radius: 40px;
      padding: 30px;
      text-align: center;
      max-width: 400px;
      animation: scaleUp 0.3s ease-in-out;
    }

    .modal p {
      font-size: 20px;
      color: #3f9142;
      margin-bottom: 20px;
    }

    .modal-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .modal button {
      background-color: #3f9142;
      color: white;
      border: none;
      padding: 10px 30px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.3s;
    }

    .modal button:hover {
      background-color: #357d38;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes scaleUp {
      from {
        transform: scale(0.9);
      }
      to {
        transform: scale(1);
      }
    }

    @keyframes fadeInPage {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <img src="/REPONIJOWEL/ASSETS/imgFolder/school-logo-large.png" alt="School Logo" style="height: 40px; margin-right: 10px;" />
      <p>Southern Philippines Institute of Science & Technology</p>
    </div>
  </header>

  <!-- admin profile-->
  <aside class="sidebar">
    <div class="admincontiner">
     <div class="admin-profile">
       <p><span class="material-symbols-outlined">person</span><span style="font-weight: 150px;">John Doe</span></p>
       <div class="white"></div>
     </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar-container">
      <nav class="nav">
        <ul>
            <li>
                <a href="/REPONIJOWEL/components//modals/me.html"><span class="material-symbols-outlined">person</span> User</a>
              </li>
              <li>
                <a href="/REPONIJOWEL/components/pages/admin.html"><span class="material-symbols-outlined">admin_panel_settings</span> Admin</a>
              </li>
              <li>
                <a href="/REPONIJOWEL/components/pages/books.html"><span class="material-symbols-outlined">book</span> Books</a>
              </li>
              <li>
                <a href="#" onclick="showLogoutModal()"><span class="material-symbols-outlined">logout</span> Log out</a>
              </li>
        </ul>
      </nav>
    </div>
  </aside>

  <main class="container">
    <!-- Start of maincontent -->
      <div class="maincontent">

    <!-- start of adminprofile -->
        <div class="adminprofile">
          <h1>Books</h1>

    <!-- start of adminprofilebtn -->
        <div class="adminprofilebtn">
          <button class="add-admin" onclick="showBookModal()"><span class="material-symbols-outlined">book</span><p>Add Books</p></button>
        </div>
    <!-- end of adminprofilebtn -->

        </div>
    <!-- end of adminprofile -->

    <!-- start of Spacee div -->
          <div class="spacecontainer">
            <div class="spacerdiv"></div>
          </div>
    <!-- end of Spacee div -->

    <!--start of table-wrappper -->
      <div class="table-wrappper">
    <!-- start of  table -->
    <div class="table-wrapper">
      <table class="user-table">
        <thead>
          <tr>
            <td>Book title</td>
            <td>Book id </td>
            <td>Book genre</td>
            <td>Book status</td>
            <td>Rented by</td>
            <td>Action</td>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td>
              <button class="btn edit-btn">Edit</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- end of table -->
      </div>
    <!-- end of table  -->

      </div>
    <!-- end of maincontent -->
  </main>

  <!-- Modal Structure -->
  <div class="modal-overlay" id="logoutModal">
    <div class="modal">
      <p>Are sure you want to log out?</p>
      <div class="modal-buttons">
        <button onclick="logout()">Yes</button>
        <button onclick="closeModal()">No</button>
      </div>
    </div>
  </div>

  <script>
    function showLogoutModal() {
      document.getElementById('logoutModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('logoutModal').style.display = 'none';
    }

    function logout() {
      closeModal();
      setTimeout(() => {
        window.location.href = '/REPONIJOWEL/components/modals/login1.html'; // Change this to the desired URL
      }, 1000); // Delay in milliseconds (1 second)
    }
  </script>

</body>
</html>
