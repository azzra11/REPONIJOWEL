<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Southern Philippines Institute of Science & Technology</title>

  <!-- icon -->
  <link rel="icon" type="image/png" href="/REPONIJOWEL/ASSETS/imgFolder/school-logo-large.png" />

  <!--  CSS -->
  <link rel="stylesheet" href="/REPONIJOWEL/ASSETS/cssFolder/admin.css" />

  <!-- Google Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      font-weight: bold;
  
      background-color: #e9f0e6;
      margin: 0;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal {
      background-color: #4f8a42;
      color: white;
      padding: 30px 40px;
      border-radius: 20px;
      width: 350px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .modal h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 16px;
      font-weight: bold;
    }

    .modal label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .modal input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .modal input[readonly] {
      background-color: white;
      color: #333;
    }

    .modal button {
      margin-top: 20px;
      padding: 10px 20px;
      width: 100%;
      border: none;
      border-radius: 20px;
      background-color: white;
      color: #4f8a42;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
      font-family: 'Roboto', sans-serif;
      font-weight: bold;
    }

    .modal button:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <img src="/REPONIJOWEL/ASSETS/imgFolder/school-logo-large.png" alt="School Logo" style="height: 40px; margin-right: 10px;" />
      <p>Southern Philippines Institute of Science & Technology</p>
    </div>
  </header>

  <!-- admin profile-->
  <aside class="sidebar">
    <div class="admincontiner">
     <div class="admin-profile">
       <p><span class="material-symbols-outlined">person</span><span style="font-weight: 150px;">John Doe</span></p>
       <div class="white"></div>
     </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar-container">
      <nav class="nav">
        <ul>
          <li>
            <a href="/REPONIJOWEL/components/pages/server.html"><span class="material-symbols-outlined">person</span> User</a>
          </li>
          <li>
            <a href="/REPONIJOWEL/components/pages/admin.html"><span class="material-symbols-outlined">admin_panel_settings</span> Admin</a>
          </li>
          <li>
            <a href="/REPONIJOWEL/components/pages/books.html"><span class="material-symbols-outlined">book</span> Books</a>
          </li>
          <li>
            <a href="#"><span class="material-symbols-outlined">logout</span> Log out</a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <main class="container">
    <!-- Start of maincontent -->
      <div class="maincontent">

    <!-- start of adminprofile -->
        <div class="adminprofile">
          <h1>Admin Profile</h1>

    <!-- start of adminprofilebtn -->
        <div class="adminprofilebtn">
          <button class="add-admin" onclick="showModal()"><span class="material-symbols-outlined">person_add</span><p>Add Admin</p></button>
        </div>
    <!-- end of adminprofilebtn -->

        </div>
    <!-- end of adminprofile -->

    <!-- start of Spacee div -->
          <div class="spacecontainer">
            <div class="spacerdiv"></div>
          </div>
    <!-- end of Spacee div -->

    <!--start of table-wrappper -->
      <div class="table-wrappper">
    <!-- start of  table -->
    <div class="table-wrapper">
      <table class="user-table">
        <thead>
          <tr>
            <td>Admin id </td>
            <td>Admin name </td>
            <td>Admin permission</td>
            <td>Username</td>
            <td>School position</td>
            <td>Action</td>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td>
              <button class="btn edit-btn">Edit</button>
              <button class="btn delete-btn">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- end of table -->
      </div>
    <!-- end of table  -->

      </div>
    <!-- end of maincontent -->
  </main>

  <!-- Modal Structure -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal">
      <h2>Southern Philippines Institute of Science & Technology</h2>

      <label for="fullname">Full name :</label>
      <input type="text" id="fullname" name="fullname">

      <label for="username">Username :</label>
      <input type="text" id="username" name="username">

      <label for="school-position">School position :</label>
      <input type="text" id="school-position" name="school-position">

      <label for="email">Email :</label>
      <input type="email" id="email" name="email">

      <label for="password">Password :</label>
      <input type="password" id="password" name="password">

      <button type="submit" onclick="closeModal()">Done</button>
    </div>
  </div>

  <script>
    function showModal() {
      document.getElementById('adminModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('adminModal').style.display = 'none';
    }
  </script>

</body>
</html>
