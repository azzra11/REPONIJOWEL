<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Center Card</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center; /* Center horizontally */
      align-items: center;     /* Center vertically */
      background: #f0f0f0;
    }

    .card {
      width: 380px;
      height: 316px;
      background-color: #4CAF50;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
    }

    .icon {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 60px;
      height: 60px;
      background: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .icon img {
      width: 30px;
      height: 30px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="icon">
    <img src="/mnt/data/9f79f74e-362e-4796-b0de-08c9a09597dc.png" alt="Profile Icon">
  </div>
</div>

</body>
</html>
